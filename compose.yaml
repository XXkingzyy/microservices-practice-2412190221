# ============================================================
# 订餐系统 - Docker Compose 编排（第 06 周微服务拆分）
# 一个 MySQL 实例（独立库/独立账号）+ 三个微服务
# 启动：docker compose up -d --build
# 停止：docker compose down        （保留数据卷，数据不丢）
# 停止并删除数据：docker compose down -v（慎用，会清空数据）
# ============================================================

x-discovery: &discovery
  NACOS_SERVER_ADDR: nacos:8848
  NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
  NACOS_PASSWORD: ${NACOS_PASSWORD:?Initialize Nacos admin password first}
  NACOS_GROUP: PERSONAL_GROUP
  NACOS_NAMESPACE: ${NACOS_NAMESPACE:-}

services:
  nacos:
    image: nacos/nacos-server:v3.2.4
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:?Set a private Base64 secret}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:?Set server identity key}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:?Set server identity value}
    ports:
      - "127.0.0.1:18080:8080"
      - "127.0.0.1:8848:8848"
      - "127.0.0.1:9848:9848"
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
  # ---------- 数据库（单实例，三个独立数据库与账号） ----------
  mysql:
    image: food-mysql:week07
    build: ./db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "127.0.0.1:13306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # ---------- 用户服务（8081 / userdb） ----------
  user-service:
    build:
      context: ./services/user-service
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      <<: *discovery
      DB_URL: jdbc:mysql://mysql:3306/userdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: user
      DB_PASSWORD: user123
    ports:
      - "127.0.0.1:8081:8081"

  # ---------- 菜单服务（8082 / menudb） ----------
  menu-service:
    build:
      context: ./services/menu-service
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      <<: *discovery
      DB_URL: jdbc:mysql://mysql:3306/menudb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: menu
      DB_PASSWORD: menu123
    ports:
      - "127.0.0.1:8082:8082"

  # ---------- 订单服务（8083 / orderdb，跨服务调用 user/menu） ----------
  order-service:
    build:
      context: ./services/order-service
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      <<: *discovery
      DB_URL: jdbc:mysql://mysql:3306/orderdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: order_user
      DB_PASSWORD: order123
      # 跨服务调用通过 Compose 服务名访问，不使用 localhost
    ports:
      - "127.0.0.1:8083:8083"

  student-service:
    profiles: [classroom]
    build: ./classroom/student-service
    environment:
      <<: *discovery
      NACOS_GROUP: COURSE_GROUP
    ports: ["127.0.0.1:8091:8091"]
    volumes: ["student-service-data:/app/data"]

  course-service:
    profiles: [classroom]
    build: ./classroom/course-service
    environment:
      <<: *discovery
      NACOS_GROUP: COURSE_GROUP
    ports: ["127.0.0.1:8092:8092"]
    volumes: ["course-service-data:/app/data"]

  enrollment-service:
    profiles: [classroom]
    build: ./classroom/enrollment-service
    environment:
      <<: *discovery
      NACOS_GROUP: COURSE_GROUP
    ports: ["127.0.0.1:8093:8093"]
    volumes: ["enrollment-service-data:/app/data"]

# 命名数据卷：容器重建后 MySQL 数据仍保留
volumes:
  mysql-data:
  nacos-data:
  nacos-logs:
  student-service-data:
  course-service-data:
  enrollment-service-data:
