spring:
  application:
    name: user-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:PERSONAL_GROUP}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/userdb}
    username: ${DB_USER:user}
    password: ${DB_PASSWORD:user123}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
