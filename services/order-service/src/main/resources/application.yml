spring:
  application:
    name: order-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:PERSONAL_GROUP}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/orderdb}
    username: ${DB_USER:order_user}
    password: ${DB_PASSWORD:order123}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

server:
  port: 8083

service:
  timeout:
    connect-ms: ${SERVICE_CONNECT_TIMEOUT_MS:2000}
    read-ms: ${SERVICE_READ_TIMEOUT_MS:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
