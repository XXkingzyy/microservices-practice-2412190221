spring:
  application:
    name: menu-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/menudb}
    username: ${DB_USER:menu}
    password: ${DB_PASSWORD:menu123}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info
