server:
  port: 8092
spring:
  application:
    name: course-service
  datasource:
    url: jdbc:h2:file:./data/course-service
    username: sa
    password: ${CLASSROOM_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}
        group: COURSE_GROUP
management:
  endpoints:
    web:
      exposure:
        include: health,info
