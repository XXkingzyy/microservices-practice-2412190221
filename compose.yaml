# ============================================================
# 订餐系统 - Docker Compose 编排
# 两个服务：mysql（MySQL 8.4.11 数据库）+ app（Spring Boot 应用）
# 启动：docker compose up -d --build
# 停止：docker compose down        （保留数据卷，数据不丢）
# 停止并删除数据：docker compose down -v（慎用，会清空数据）
# ============================================================

services:
  # ---------- 数据库 ----------
  mysql:
    image: mysql:8.4.11
    container_name: food-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-course}
      MYSQL_USER: ${DB_USER:-course}
      MYSQL_PASSWORD: ${DB_PASSWORD:-course123}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # ---------- 应用 ----------
  app:
    build:
      context: ./monolith
    container_name: food-app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # 通过服务名 mysql 访问数据库（同一 Compose 网络内）
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-course}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: ${DB_USER:-course}
      DB_PASSWORD: ${DB_PASSWORD:-course123}
    ports:
      - "8080:8080"

# 命名数据卷：容器重建后 MySQL 数据仍保留
volumes:
  mysql-data:
